{
  "schedule": {
    "blacklight_posix_file_events": {
      "query": "SELECT * FROM file_events WHERE category = 'blacklight_agent_artifacts';",
      "interval": 60,
      "removed": false
    }
  },
  "file_paths": {
    "blacklight_agent_artifacts": [
      "/home/%/.codex/%%",
      "/home/%/.claude/%%",
      "/home/%/.cursor/%%",
      "/home/%/.gemini/antigravity-cli/%%",
      "/home/%/.claude.json",
      "/root/.codex/%%",
      "/root/.claude/%%",
      "/root/.cursor/%%",
      "/root/.gemini/antigravity-cli/%%",
      "/root/.claude.json",
      "/Users/%/.codex/%%",
      "/Users/%/.claude/%%",
      "/Users/%/.cursor/%%",
      "/Users/%/.gemini/antigravity-cli/%%",
      "/Users/%/.claude.json",
      "/var/root/.codex/%%",
      "/var/root/.claude/%%",
      "/var/root/.cursor/%%",
      "/var/root/.gemini/antigravity-cli/%%",
      "/var/root/.claude.json"
    ]
  },
  "file_accesses": [
    "blacklight_agent_artifacts"
  ]
}
