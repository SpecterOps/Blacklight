{
  "options": {
    "disable_events": "false",
    "enable_file_events": "true"
  },
  "schedule": {
    "blacklight_posix_file_events": {
      "query": "SELECT * FROM file_events WHERE category = 'blacklight_agent_artifacts';",
      "interval": 60,
      "removed": false
    },
    "blacklight_macos_endpointsecurity_file_events": {
      "query": "SELECT * FROM es_process_file_events;",
      "interval": 60,
      "removed": false
    },
    "blacklight_artifact_inventory": {
      "query": "WITH user_homes AS (SELECT username, directory FROM users WHERE directory LIKE '/%' AND directory NOT IN ('/', '/dev/null', '/nonexistent', '/var/empty')), targets(tool, family, relative_path) AS (VALUES ('codex', 'auth', '/.codex/auth.json'), ('codex', 'config', '/.codex/config.toml'), ('codex', 'sessions', '/.codex/session_index.jsonl'), ('claude_code', 'auth', '/.claude/.credentials.json'), ('claude_code', 'config', '/.claude/settings.json'), ('claude_code', 'config', '/.claude.json'), ('claude_code', 'config', '/.claude.json'), ('cursor', 'config', '/.cursor/cli-config.json'), ('cursor', 'mcp', '/.cursor/mcp.json'), ('cursor', 'history', '/.cursor/prompt_history.json'), ('antigravity_cli', 'config', '/.gemini/antigravity-cli/settings.json'), ('antigravity_cli', 'mcp', '/.gemini/antigravity-cli/mcp_config.json'), ('grok', 'auth', '/.grok/auth.json'), ('grok', 'config', '/.grok/config.toml'), ('grok', 'sessions', '/.grok/active_sessions.json'), ('grok', 'sessions', '/.grok/sessions/session_search.sqlite'), ('devin', 'auth', '/.local/share/devin/credentials.toml'), ('devin', 'config', '/.config/devin'), ('strands', 'config', '/.strands/cli/config.json'), ('strands', 'sessions', '/.strands/cli/session-roots.json'), ('kiro', 'auth', '/.local/share/kiro-cli/data.sqlite3'), ('kiro', 'config', '/.kiro/settings/cli.json'), ('kiro', 'mcp', '/.kiro/settings/mcp.json'), ('opencode', 'auth', '/.local/share/opencode/auth.json'), ('opencode', 'auth', '/.local/share/opencode/opencode.db'), ('opencode', 'config', '/.config/opencode/opencode.json'), ('opencode', 'config', '/.config/opencode/cli.json'), ('muse_code', 'auth', '/.config/muse/auth.json'), ('muse_code', 'config', '/.config/muse/settings.json'), ('muse_code', 'config', '/.config/muse/trust.json'), ('muse_code', 'sessions', '/.local/share/muse/session-index.db')) SELECT targets.tool, targets.family, user_homes.username, file.path, file.type, file.uid, file.gid, file.mode, file.size, datetime(file.mtime, 'unixepoch') AS mtime_utc FROM user_homes CROSS JOIN targets JOIN file ON file.path = user_homes.directory || targets.relative_path ORDER BY targets.tool, targets.family, file.path;",
      "interval": 3600,
      "removed": false
    }
  },
  "file_paths": {
    "blacklight_agent_artifacts": [
      "/Users/%/.codex/%%",
      "/Users/%/.claude/%%",
      "/Users/%/.cursor/%%",
      "/Users/%/.gemini/antigravity-cli/%%",
      "/Users/%/.grok/%%",
      "/Users/%/.local/share/devin/%%",
      "/Users/%/.config/devin/%%",
      "/Users/%/.strands/%%",
      "/Users/%/.cache/devin/%%",
      "/Users/%/.kiro/%%",
      "/Users/%/.local/share/kiro-cli/%%",
      "/Users/%/.local/share/amazon-q/%%",
      "/Users/%/.aws/amazonq/%%",
      "/Users/%/.opencode/%%",
      "/Users/%/.local/share/opencode/%%",
      "/Users/%/.config/opencode/%%",
      "/Users/%/.cache/opencode/%%",
      "/Users/%/.local/state/opencode/%%",
      "/Users/%/.config/muse/%%",
      "/Users/%/.local/share/muse/%%",
      "/Users/%/.muse/%%",
      "/Users/%/.claude.json",
      "/var/root/.codex/%%",
      "/var/root/.claude/%%",
      "/var/root/.cursor/%%",
      "/var/root/.gemini/antigravity-cli/%%",
      "/var/root/.grok/%%",
      "/var/root/.local/share/devin/%%",
      "/var/root/.config/devin/%%",
      "/var/root/.strands/%%",
      "/var/root/.cache/devin/%%",
      "/var/root/.kiro/%%",
      "/var/root/.local/share/kiro-cli/%%",
      "/var/root/.local/share/amazon-q/%%",
      "/var/root/.aws/amazonq/%%",
      "/var/root/.opencode/%%",
      "/var/root/.local/share/opencode/%%",
      "/var/root/.config/opencode/%%",
      "/var/root/.cache/opencode/%%",
      "/var/root/.local/state/opencode/%%",
      "/var/root/.config/muse/%%",
      "/var/root/.local/share/muse/%%",
      "/var/root/.muse/%%",
      "/var/root/.claude.json"
    ]
  }
}
